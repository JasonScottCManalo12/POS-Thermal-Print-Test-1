name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files without replacing app source
        run: |
          flutter create --platforms=android --project-name pos_thermal_print_test_1 --org com.posthermalprinttest /tmp/pos_android_scaffold
          cp -R /tmp/pos_android_scaffold/android ./android

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-thermal-print-test-1-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
